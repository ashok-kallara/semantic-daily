[project]
name = "semantic-daily"
version = "1.0.0"
description = "Daily AI & tech news feed aggregator with deduplication, LLM summaries, and Telegram delivery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Source collectors
    "aiohttp>=3.11,<4",
    "feedparser>=6.0,<7",
    "exa-py>=1.0,<2",
    "podcast-api>=1.1,<2",
    # Data models & validation
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    # Deduplication
    "jellyfish>=1.1,<2",
    # LLM
    "ollama>=0.4,<1",
    "openai>=1.60,<2",
    # Telegram
    "python-telegram-bot>=21,<22",
    # Utilities
    "structlog>=24,<25",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.14.3",
    "upstash-redis>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-mock>=3.14,<4",
    "aioresponses>=0.7,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
semantic-daily = "src.main:main"
publish-surge = "src.delivery.web:deploy_surge_cli"
publish-telegram = "src.delivery.telegram:send_latest_cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
